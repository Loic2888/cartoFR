# CI de cartoFR : lint, typecheck, tests et build du worker et de l'interface.
# Le merge d'une PR vers main exige ces deux jobs au vert (garde-fou 4).
# Aucun secret, aucune donnée du registre : la CI ne voit que du code.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur la même branche annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker (Python)
    runs-on: ubuntu-latest
    # Base éphémère pour le test RLS (T006) : même image que infra/docker-compose.yml.
    # Elle fournit déjà le schéma auth, auth.users, auth.uid() et les rôles anon,
    # authenticated et service_role.
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          # Valeur factice : conteneur jetable, détruit à la fin du job.
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      # Venv à la racine, comme en local : pyright y est pointé (venvPath dans worker/pyproject.toml).
      - name: Installer le worker
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "worker[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check worker

      - name: Format (ruff)
        run: .venv/bin/ruff format --check worker

      # Toujours -p : sans lui, pyright ne vérifie rien et sort à 0.
      - name: Typecheck (pyright)
        run: .venv/bin/pyright -p worker

      # Chaque migration dans sa transaction, dans l'ordre des noms ; la première erreur arrête tout.
      - name: Appliquer les migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "migration : $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # Données de départ (T018) : réglages historiques des groupes. Le seed doit
      # être à jour de config/*.json, et passer sur une base migrée.
      - name: Appliquer les données de départ
        run: |
          .venv/bin/python worker/scripts/generer_seed_reglages.py --check
          for f in supabase/seed/*.sql; do
            echo "seed : $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done

      # CI est défini par GitHub : sans base, le test RLS échoue au lieu d'être ignoré.
      - name: Tests (pytest)
        run: .venv/bin/pytest worker -rs

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      # Le build télécharge les polices Geist : réseau requis.
      - name: Build
        run: npm run build
